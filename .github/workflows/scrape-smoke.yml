name: Scrape smoke

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run live source smoke checks?"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: scrape-smoke
  cancel-in-progress: false

jobs:
  scrape-smoke:
    name: Manual source reachability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scrape smoke checks
        env:
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT || 'CarMarketWatch/0.1 smoke-check contact@example.com' }}
        run: pnpm scrape:smoke
