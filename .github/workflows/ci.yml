name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Install, verify, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck if present
        shell: bash
        run: |
          if pnpm run | grep -q '^  typecheck'; then
            pnpm typecheck
          else
            echo "No typecheck script defined; skipping."
          fi

      - name: Test if present
        shell: bash
        run: |
          if pnpm run | grep -q '^  test'; then
            pnpm test
          else
            echo "No test script defined; skipping."
          fi

      - name: Build
        run: pnpm build
