services:
  postgres:
    image: postgres:16-alpine
    container_name: car-market-watch-postgres
    environment:
      POSTGRES_USER: car_market_watch
      POSTGRES_PASSWORD: car_market_watch
      POSTGRES_DB: car_market_watch
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U car_market_watch -d car_market_watch']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - car-market-watch-postgres:/var/lib/postgresql/data

volumes:
  car-market-watch-postgres:
